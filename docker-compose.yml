# Local development stack. `make up` starts everything; open http://wideline.localhost
#
# Hostnames (all served by Caddy on port 80):
#   wideline.localhost       web app and API
#   s3.wideline.localhost    S3 API (presigned URLs are signed for this host)
#   mail.wideline.localhost  Mailpit inbox (magic links)
#   console.wideline.localhost  RustFS console
#
# Containers reach the same hostnames through network aliases on the caddy
# service, so a presigned URL works from the browser and from a worker alike.

name: wideline

x-web-env: &web-env
  env_file: .env
  environment: &web-environment
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    S3_INTERNAL_ENDPOINT: http://rustfs:9000
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    # ffmpeg thread cap for the transcode worker (C07). Three x264 encoders on
    # every core can exhaust a small Docker VM's memory.
    TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - rustfs
      - mailpit
    networks:
      default:
        aliases:
          - wideline.localhost
          - s3.wideline.localhost

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published to the host by default (NFR-22). Uncomment for a local GUI.
    # ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. MinIO no longer publishes container images,
  # so local dev uses RustFS. The app only speaks the S3 API, so Hetzner Object
  # Storage replaces this in production with configuration only.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - rustfs-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # One-shot: apply migrations and create the bucket, then exit.
  init:
    <<: *web-env
    build:
      context: ./web
      target: dev
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm tsx scripts/init-storage.ts"
    volumes:
      - ./web:/app
      # Anonymous: refreshed from the image on every `make up` (-V), so the
      # image is the single source of installed dependencies.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  web:
    <<: *web-env
    build:
      context: ./web
      target: dev
    command: pnpm dev
    volumes:
      - ./web:/app
      # Anonymous: refreshed from the image on every `make up` (-V), so the
      # image is the single source of installed dependencies.
      - /app/node_modules
      # Also anonymous, so the dev build cache is renewed with node_modules.
      # A cache built against other installed packages sends the browser into
      # a Fast Refresh reload loop.
      - /app/.next
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30

  transcode-worker:
    <<: *web-env
    build:
      context: ./web
      target: dev
    command: pnpm worker:dev
    environment:
      <<: *web-environment
      # C08: the CV queues run in cv-dispatcher. C09: clips run here (ffmpeg).
      WORKER_QUEUES: probe,transcode,clips,retention,consent-withdrawn
    # Bounded so a 1080p encode cannot starve web and postgres of memory.
    mem_limit: ${TRANSCODE_MEM_LIMIT:-2g}
    volumes:
      - ./web:/app
      # Anonymous: refreshed from the image on every `make up` (-V), so the
      # image is the single source of installed dependencies.
      - /app/node_modules
    depends_on:
      init:
        condition: service_completed_successfully

  # C08: CV dispatch and the GPU watchdog. Starts one wideline-cv-worker
  # container per CV attempt through the Docker socket. The socket is
  # root-equivalent on the host: development only, never in production (the
  # hourly GPU provider replaces it, C19).
  cv-dispatcher:
    <<: *web-env
    build:
      context: ./web
      target: dev
    command: pnpm worker:dev
    environment:
      <<: *web-environment
      WORKER_QUEUES: cv,cv-watchdog
      WIDELINE_SERVICE: cv-dispatcher
    volumes:
      - ./web:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      init:
        condition: service_completed_successfully

  # C08: the CV worker image, built by `make up` (or `make cv-image`) and never
  # started by compose: cv-dispatcher starts one container per attempt.
  cv-worker:
    build: ./cv_worker
    image: wideline-cv-worker:dev
    profiles: [cv-image]

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
