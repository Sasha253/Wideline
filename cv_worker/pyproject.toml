[project]
name = "wideline-cv"
version = "0.1.0"
description = "Wideline computer-vision worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "structlog>=25.1",
]

# Real-model dependencies (Phase 5). Kept optional so CI and the synthetic
# detector stay light. Licences are tracked in /LICENSES.md; no AGPL code
# (e.g. ultralytics) may be added here or anywhere in the CV path.
[project.optional-dependencies]
model = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pip-licenses>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wideline_cv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wideline_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
